# Tag vX.Y.Z to release. Archives, checksums and the image are built from the
# tag by this workflow and nowhere else, so what is published is what CI built.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: tests must pass on the tagged commit
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq iproute2 nftables
          # As in ci.yml: Docker's FORWARD DROP would otherwise mask our rule.
          sudo iptables -P FORWARD ACCEPT
          sudo env "PATH=$PATH" go test -count=1 ./...

      - name: archives and SHA256SUMS
        run: make dist VERSION=${{ github.ref_name }}

      - name: build provenance for the archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Re-runnable: if the release exists (a later step failed and the run
        # is being retried), replace its assets instead of failing here.
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "${{ github.ref_name }}" dist/*.tar.gz dist/SHA256SUMS \
              --title "${{ github.ref_name }}" --generate-notes --verify-tag
          fi

      # Image names must be lowercase; the repository owner is not.
      # The build date is the commit's, so rebuilding the tag gives the same labels.
      - name: image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agw" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agw
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.image.outputs.date }}
          # A multi-architecture image is an index; GitHub reads the source
          # link and description from the index, the labels from each image.
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.description=Contain AI agents, and prove what they did.
            index:org.opencontainers.image.licenses=Apache-2.0
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
      # The attestation is stored by GitHub and verified with
      # `gh attestation verify oci://ghcr.io/aryan22g/agw:TAG --owner Aryan22g`.
      # Not pushed to the registry as well: GHCR lists that copy as a tagged
      # version (sha256-...), newest of all, so the package page offered it as
      # "Latest" and as the pull command.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false
