[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ags-sdk"
version = "1.0.0"
description = "AGS1 client SDK for the Agent Gateway: signed, authorized, auditable agent requests"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }

dependencies = [
    # Ed25519 signing. The stdlib has no Ed25519, so this is unavoidable.
    "cryptography>=41.0",
    # Used by the default Client transport. Callers who supply their own
    # session (httpx, aiohttp) can sign with ags_sdk.sign_request and skip it.
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["ags_sdk*"]
