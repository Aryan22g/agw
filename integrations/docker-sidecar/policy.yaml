# What the confined agent may reach. Everything else is refused, and so is
# the cloud metadata endpoint whatever this file says.
version: "1"
workloads:
  - id: agent
    allow:
      - host: pypi.org
        ports: [443]
        note: package index
      - host: files.pythonhosted.org
        ports: [443]
        note: package downloads
permit_private: []
